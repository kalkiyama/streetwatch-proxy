name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server.js && node --check adsb-proxy.js && node --check ais-proxy.js
      - run: node test-combined.js
      - run: node test-secure.js
